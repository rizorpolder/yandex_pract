global:
  scrape_interval: 15s

scrape_configs:
  - job_name: events-service
    static_configs:
      - targets: ["events-service:8080"]
    metrics_path: /metrics

  - job_name: booking-service
    static_configs:
      - targets: ["booking-service:8080"]
    metrics_path: /metrics

  - job_name: auth-service
    static_configs:
      - targets: ["auth-service:8080"]
    metrics_path: /metrics